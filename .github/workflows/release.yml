name: Release build

# Builds SpaceLens.exe and attaches it to a GitHub release when the release is published.
# Can also be run by hand (Actions → Release build → Run workflow) to get the exe as a build artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = if ($tag) { $tag.TrimStart('v', 'V') } else { "0.0.0-dev" }
          if ($version -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?$') { throw "Tag '$tag' is not a version like v1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building version $version"

      - name: Restore
        run: dotnet restore SpaceLens.sln

      - name: Test
        run: dotnet test SpaceLens.sln -c Release --no-restore

      - name: Publish (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/SpaceLens/SpaceLens.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o out/framework

      - name: Publish (self-contained, no runtime needed)
        run: >
          dotnet publish src/SpaceLens/SpaceLens.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o out/standalone

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/framework/SpaceLens.exe "dist/SpaceLens-$v-win-x64.exe"
          Compress-Archive -Path out/standalone/SpaceLens.exe -DestinationPath "dist/SpaceLens-$v-win-x64-standalone.zip"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceLens-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
